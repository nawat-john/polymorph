name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The frontend arrives in Phase 4; until web/package.json exists every step below is skipped.
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: Type check
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run check
      - name: Build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run build
