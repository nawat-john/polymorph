# Builds a multi-arch image per service and pushes it to GHCR on a version
# tag (design-plan.md sections 13/14). Requires nothing beyond the repo's
# built-in GITHUB_TOKEN (packages: write) - see docs/deployment.md for
# pulling these images on the VPS.
name: images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [ingestor, processor, gateway, recorder, loadgen-producer, loadgen-clients]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/oddspulse-${{ matrix.service }}:${{ github.ref_name }}
