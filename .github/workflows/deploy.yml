# Optional (design-plan.md section 14): SSH into the VPS and pull/restart
# the stack. This is a template, not a working deploy - it cannot run until
# a human adds these repo secrets (Settings -> Secrets and variables ->
# Actions), documented in docs/deployment.md:
#   VPS_HOST     - the VPS's public IP or hostname
#   VPS_USER     - the SSH user to deploy as
#   VPS_SSH_KEY  - a private key authorized on the VPS for that user
# and has already cloned this repo (or at least deploy/) to
# /opt/oddspulse on the VPS once, by hand, with images.yml's tag pushed to
# GHCR and pull access configured there.
name: deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into the VPS and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/oddspulse
            git pull
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml pull
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
