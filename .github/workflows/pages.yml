# Builds web/ and deploys to GitHub Pages (design-plan.md sections 13/14).
# Requires (see docs/deployment.md): Pages enabled with source "GitHub
# Actions" in repo settings, and a repo variable VITE_WS_URL pointing at the
# real deployed gateway (wss://api.<domain>/ws) - without it the build falls
# back to LiveSource's own localhost default, which is fine for a Pages
# preview build but not for the real public site.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
